[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipforge-backend"
version = "0.1.0"
description = "ClipForge AI - AI Video Intelligence Platform (backend)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ClipForge AI" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.0",
    "dramatiq[redis]>=1.17",
    "httpx>=0.27",
    "PyJWT>=2.9",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "sse-starlette>=2.0",
    "yt-dlp>=2025.1.15",
    "google-genai>=1.0",
    "prometheus-client>=0.21",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "motion-caption>=0.1.3",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-api>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[project.optional-dependencies]
intelligence = [
    "pyscenedetect>=0.6.3",
    "librosa>=0.10.2",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clipforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.security.HTTPBearer",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
