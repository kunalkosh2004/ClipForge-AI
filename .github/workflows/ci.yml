name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Fonts the caption/overlay renderers rely on (match the Docker image).
      - name: Install rendering fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core

      # motion-caption>=0.1.3 is not on PyPI (only 0.1.2) — install the
      # vendored wheel first (mirrors the Dockerfile), then the editable
      # install satisfies the pin from the vendored copy.
      - name: Install dependencies
        run: |
          pip install ./vendor/motion_caption-0.1.3-py3-none-any.whl
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/unit -q

  frontend:
    name: Frontend (eslint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
